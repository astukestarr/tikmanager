// TikManager: installed by deploy/install.sh and every upgrade as /etc/apt/apt.conf.d/52tikmanager-unattended.
// Ubuntu's automatic security updates (unattended-upgrades) also:
//   - restart the server at 03:00 when an update needs it (kernel / core libraries) - routers keep working; TikManager
//     is offline for about a minute
//   - keep Caddy updated, which comes from its own package repository (dl.cloudsmith.io), not Ubuntu's
// To opt out, set Automatic-Reboot to "false" in a file that sorts after this one (e.g. 60local-unattended).
Unattended-Upgrade::Origins-Pattern {
        "site=dl.cloudsmith.io";
};
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "03:00";
