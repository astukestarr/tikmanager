<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 66" role="img" aria-label="TikManager">
  <title>TikManager</title>
  <!-- default logo: "TikManager" with the T drawn as a tiki torch. Replaced by a logo uploaded on Admin > Branding.
       Plain fill colours (no style block: the strict CSP blocks it) that read on light and dark backgrounds. -->
  <!-- the T: flame -->
  <path fill="#F26B1D" d="M19 0c4 6.5 10 9.5 9 18C27.3 22.6 23.8 25 19 25s-8.3-2.4-9-7c-.7-6.2 4.3-8.6 5.8-13.6.8 3.4 2.2 4.6 3.1 5.8.3-3.1-.6-6.6.1-10.2z"/>
  <path fill="#FFB627" d="M19 8c3.1 3.9 5.6 6.6 4.9 10.9C23.4 21.6 21.5 23 19 23s-4.5-1.4-5-4.1c-.5-3.1 2-5 3.3-7.4.7 1.6 1.4 2 1.7 2 .3-1.2-.3-3.5 0-5.5z"/>
  <ellipse cx="19" cy="19.6" rx="2.8" ry="3" fill="#FFF0BF"/>
  <!-- the T's crossbar: carved tiki cup -->
  <rect x="1" y="21" width="36" height="4" rx="2" fill="#5E3A1A"/>
  <rect x="3" y="24" width="32" height="13" rx="2.5" fill="#8A5527"/>
  <ellipse cx="12.5" cy="28.6" rx="3" ry="2.1" fill="#F6E3B4"/>
  <ellipse cx="25.5" cy="28.6" rx="3" ry="2.1" fill="#F6E3B4"/>
  <circle cx="12.5" cy="28.8" r="1.1" fill="#2E1B0C"/>
  <circle cx="25.5" cy="28.8" r="1.1" fill="#2E1B0C"/>
  <path fill="#5E3A1A" d="M17.6 26.5h2.8l.8 4h-4.4z"/>
  <rect x="11" y="31.6" width="16" height="3.4" rx="1.7" fill="#2E1B0C"/>
  <path stroke="#F6E3B4" stroke-width="1" d="M14.6 31.8v3M17.8 31.8v3M21 31.8v3M24.2 31.8v3"/>
  <!-- the T's stem: bamboo pole -->
  <path fill="#C9A267" d="M14.2 37h9.6l-1.2 25h-7.2z"/>
  <rect x="13.4" y="36.6" width="11.2" height="2.6" rx="1" fill="#5E3A1A"/>
  <rect x="14.7" y="45.5" width="8.6" height="1.8" rx=".8" fill="#8D6B3A"/>
  <rect x="15.1" y="54" width="7.8" height="1.8" rx=".8" fill="#8D6B3A"/>
  <!-- "ikManager" (fixed width so it fits whatever sans-serif font the device has) -->
  <text x="40" y="62" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="800"
        textLength="256" lengthAdjust="spacingAndGlyphs"><tspan fill="#A9682C">ik</tspan><tspan fill="#E8611A">Manager</tspan></text>
</svg>
