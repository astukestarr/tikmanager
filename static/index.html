<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikManager</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="Sections">
      <div class="nav-brand"><div class="brand"><img class="brand-logo brand-wordmark" src="/wordmark.svg" alt="TikManager"></div></div>
      <div class="nav-user" id="navUser" hidden>
        <span class="avatar" id="navAvatar" aria-hidden="true"></span>
        <span class="nav-who"><span class="nav-name" id="navName"></span><span class="nav-role" id="navRole"></span></span>
      </div>
      <div class="nav-items">
        <button type="button" data-view="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></button>
        <button type="button" data-view="routers"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="13" width="19" height="7" rx="2"/><path d="M6.5 16.5h.01M10 16.5h.01M8 13l-2-6M16 13l2-6M5 7.5a1.5 1.5 0 1 0 0-.01M19 7.5a1.5 1.5 0 1 0 0-.01"/></svg><span>Routers</span></button>
        <button type="button" data-view="sites"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5 5 16.5M12 11.5l7 5"/></svg><span>Site map</span></button>
        <button type="button" data-view="subnets"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg><span>Subnets</span></button>
        <button type="button" data-view="vpns" data-tech><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Site-to-site VPN</span></button>
        <button type="button" data-view="backups" data-tech><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg><span>Backups</span></button>
        <button type="button" data-view="upgrades" data-tech><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16V8M8.5 11.5 12 8l3.5 3.5"/></svg><span>Upgrades</span></button>
        <button type="button" data-view="tasks" data-tech><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg><span>Tasks</span></button>
        <button type="button" data-view="clients" data-tech><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21v-6h6v6M8 10h.01M12 10h.01M16 10h.01"/></svg><span>Clients</span></button>
        <button type="button" data-view="users" data-admin><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span>Users</span></button>
        <button type="button" data-view="audit" data-techadmin><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span>Audit log</span></button>
        <button type="button" data-view="admin" data-techadmin><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Admin</span></button>
      </div>
      <div class="nav-version" id="navVersion"></div>
    </nav>

    <div class="content">
      <div class="top-sticky">
        <header class="topbar">
          <button class="icon-btn menu-btn" type="button" id="menuBtn" aria-label="Show the menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <span class="ver-chip hidden" id="verChip" title="The TikManager version this server is running"></span>
          <span class="pill hidden" id="devBadge">DEV · simulated routers</span>
          <span class="spacer"></span>
          <button class="icon-btn" type="button" id="appearanceBtn" title="Appearance: colours and light / dark mode" aria-label="Appearance">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H16a5 5 0 0 0 5-5c0-3.9-4-7-9-7z"/><circle cx="7.5" cy="11.5" r="1.2"/><circle cx="10.5" cy="7.5" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg></button>
          <span class="who small" id="who"></span>
          <button class="btn" type="button" id="logout">Sign out</button>
        </header>
        <!-- new version available (administrators): on every page until upgraded or hidden for the day -->
        <div class="update-banner hidden" id="updateBanner" role="status" aria-live="polite">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16V8M8 12l4-4 4 4"/></svg>
          <span id="ubText"></span>
          <span class="spacer"></span>
          <a id="ubNotes" class="ub-link hidden" target="_blank" rel="noopener noreferrer">What's new</a>
          <button class="btn ub-go" type="button" id="ubGo">Upgrade now</button>
          <button class="ub-close" type="button" id="ubClose" aria-label="Hide until tomorrow" title="Hide until tomorrow">×</button>
        </div>
      </div>
      <main class="main" id="main"></main>
    </div>
  </div>

  <dialog id="dlg"><div id="dlgBody"></div></dialog>
  <script src="/brand.js"></script>
  <script src="/geomap.js"></script>
  <script src="/app.js"></script>
</body>
</html>
